name: Devkit
description: Run the same Devkit scan the CLI uses
inputs:
  root:
    default: "."
  format:
    default: pretty
runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      working-directory: ${{ github.action_path }}/src/backend
      run: python -m app.cli scan "${{ inputs.root }}" --format "${{ inputs.format }}"
